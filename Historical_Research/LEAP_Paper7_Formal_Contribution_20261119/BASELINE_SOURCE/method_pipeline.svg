   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="89.1648" y="26.911523" transform="rotate(-0 89.1648 26.911523)">Optional observation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #253c4a" transform="translate(30.484097 42.459358)">Finding · observation time</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #253c4a" transform="translate(24.546909 54.247037)">Observed context and policy</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="259.2" y="26.911523" transform="rotate(-0 259.2 26.911523)">Current review context</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="259.2" y="42.459358">Event time · unit · context · policy</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="259.2" y="54.247037">Optional suppression and expiry</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="429.2352" y="26.871679" transform="rotate(-0 429.2352 26.871679)">Lifecycle parameters</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #253c4a" transform="translate(378.546919 42.459358)">Qualification · clearing</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #253c4a" transform="translate(357.927075 54.247037)">Escalation · freshness · severity</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="259.2" y="95.340323" transform="rotate(-0 259.2 95.340323)">Normalize the event interface</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="259.2" y="114.791179" transform="rotate(-0 259.2 114.791179)">Validate fields and time units; preserve version relationships</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="89.1648" y="161.695522" transform="rotate(-0 89.1648 161.695522)">1  Reset when required</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="89.1648" y="175">Compare with the prior event.</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="89.1648" y="187">If either version changes,</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="89.1648" y="199">reset activity and all timers.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="259.2" y="161.695522" transform="rotate(-0 259.2 161.695522)">2  Update the episode</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="259.2" y="173">Check observation validity.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="259.2" y="183">Valid: update qualification</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="259.2" y="193">and clearing timers.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="259.2" y="203">Unresolved: discard run timers.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="429.2352" y="161.655679" transform="rotate(-0 429.2352 161.655679)">3  Set displayed state</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="429.2352" y="173">Unresolved → UNKNOWN</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="429.2352" y="183">Else derive state incl. escalation.</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="429.2352" y="193">Suppress only if active, both</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="429.2352" y="203">versions match, and t &lt; expiry.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #6c828f" x="259.2" y="221.498797" transform="rotate(-0 259.2 221.498797)">Update the prior episode state at each supplied event</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="259.2" y="250.860322" transform="rotate(-0 259.2 250.860322)">Event outputs</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="259.2" y="269.467535" transform="rotate(-0 259.2 269.467535)">Displayed state · episode activity · severity · reason</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #253c4a" x="259.2" y="301.539758" transform="rotate(-0 259.2 301.539758)">Compare complete decisions and active-episode intervals separately</text>
   </g>
  </g>
